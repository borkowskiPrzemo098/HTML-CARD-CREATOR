<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Card Creator — generator opisów produktów</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');

  .panel-right { flex: 2 1 600px; min-width: 340px; position: sticky; top: 24px; }

  .card {
    background: #fff; border-radius: 12px; padding: 20px 22px; margin-bottom: 18px;

  .card h3.section-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;

  .tpl-picker { display: flex; gap: 12px; flex-wrap: wrap; }

<header class="app-header">
  <h1>HTML Card Creator</h1>
  <p>Wklej tekst do odpowiednich pól, zobacz podgląd i skopiuj gotowy kod HTML do opisu produktu w e-Sklep.</p>
</header>

<div class="layout">

  <div class="panel-left">

    <div class="card">
      <h2>1. Wybierz szablon</h2>
      <div class="tpl-picker" id="tplPicker"></div>
    </div>

    <div class="card">
      <h2>2. Uzupełnij treść</h2>
      <div id="formArea"></div>
    </div>

  </div>

  <div class="panel-right">
    <div class="copy-bar">
      <button class="copy-btn" id="copyBtn">Kopiuj kod HTML</button>
      <span id="copyStatus" style="font-size:12.5px;color:#666;"></span>
    </div>
    <div class="preview-frame-wrap">
      <div class="preview-frame-header">Podgląd — tak będzie wyglądać opis w e-Sklep</div>
      <div id="previewArea"></div>
    </div>
  </div>

</div>

<footer>HTML Card Creator — narzędzie wewnętrzne do generowania opisów produktów</footer>

/* ============================================================
   HELPERY
   ============================================================ */
function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// zamienia **pogrubienie** na <b>, pojedyncze enter zachowuje jako spacja, podwójny enter (pusta linia) jako nowy akapit <br><br>
function richText(s){
  var e = esc(s||'').trim();
  e = e.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  var paragraphs = e.split(/\n\s*\n/).map(function(p){ return p.trim().replace(/\n/g,' '); }).filter(Boolean);
  return paragraphs.join('<br><br>');
}
function line(s){
  return esc(s||'').trim().replace(/\n/g,' ');
}
function ph(id){ return 'PODMIEN-ZDJECIE-' + id + '.jpg'; }
function imgTag(id, alt, note){
  return '<!-- ZDJĘCIE DO PODMIANY: ' + note + ' -->\n      <img src="' + ph(id) + '" alt="' + esc(alt) + '">';
}
function placeholderPreviewSrc(label){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300">'+
    '<rect width="100%" height="100%" fill="#e8e6df"/>'+
    '<text x="50%" y="50%" font-family="Arial" font-size="15" fill="#999" text-anchor="middle" dominant-baseline="middle">'+label+'</text>'+
    '</svg>';
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

var TEMPLATES = [TPL_PROSTY, TPL_DLUGI, TPL_ZAAWANSOWANY];

/* ============================================================
   APLIKACJA
   ============================================================ */
var currentTpl = null;
var values = {};

function initPicker(){
  var wrap = document.getElementById('tplPicker');
  wrap.innerHTML = '';
  TEMPLATES.forEach(function(t){
    var btn = document.createElement('div');
    btn.className = 'tpl-btn';
    btn.innerHTML = '<strong>' + t.name + '</strong><span>' + t.desc + '</span>';
    btn.addEventListener('click', function(){ selectTemplate(t.id); });
    btn.dataset.id = t.id;
    wrap.appendChild(btn);
  });
}

function selectTemplate(id){
  currentTpl = TEMPLATES.find(function(t){ return t.id === id; });
  values = {};
  currentTpl.fields.forEach(function(f){ values[f.key] = f.def || ''; });
  document.querySelectorAll('.tpl-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.id === id);
  });
  renderForm();
  renderPreview();
}

function renderForm(){
  var area = document.getElementById('formArea');
  area.innerHTML = '';
  var lastSection = null;
  currentTpl.fields.forEach(function(f){
    if(f.section && f.section !== lastSection){
      var h = document.createElement('h3');
      h.className = 'section-label';
      h.textContent = f.section;
      area.appendChild(h);
      lastSection = f.section;
    }
    var lbl = document.createElement('label');
    lbl.textContent = f.label;
    area.appendChild(lbl);
    var input;
    if(f.type === 'textarea'){
      input = document.createElement('textarea');
    } else {
      input = document.createElement('input');
      input.type = 'text';
    }
    input.value = values[f.key] || '';
    input.addEventListener('input', function(){
      values[f.key] = input.value;
      renderPreview();
    });
    area.appendChild(input);
  });
}

function renderPreview(){
  var html = currentTpl.render(values);
  var previewHtml = html.replace(/src="PODMIEN-ZDJECIE-([^"]+)"/g, function(_, id){
    return 'src="' + placeholderPreviewSrc('ZDJĘCIE ' + id + ' — do podmiany') + '"';
  });
  document.getElementById('previewArea').innerHTML = previewHtml;
}

document.getElementById('copyBtn').addEventListener('click', function(){
  if(!currentTpl) return;
  var html = currentTpl.render(values);
  navigator.clipboard.writeText(html).then(function(){
    var btn = document.getElementById('copyBtn');
    var status = document.getElementById('copyStatus');
    btn.classList.add('copied');
    btn.textContent = 'Skopiowano ✓';
    status.textContent = 'Kod HTML skopiowany do schowka — wklej go w zakładce HTML opisu produktu.';
    setTimeout(function(){
      btn.classList.remove('copied');
      btn.textContent = 'Kopiuj kod HTML';
      status.textContent = '';
    }, 2200);
  });
});

initPicker();
selectTemplate('prosty');
